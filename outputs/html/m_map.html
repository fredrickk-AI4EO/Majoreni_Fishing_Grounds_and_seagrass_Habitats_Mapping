<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GeoLibre Map</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #geolibre-frame { border: 0; display: block; width: 100%; height: 800px; }
</style>
</head>
<body>
<iframe id="geolibre-frame" src="https://viewer.geolibre.app/?embed=1" allow="fullscreen" allowfullscreen></iframe>
<script type="application/json" id="geolibre-project">{"version": "0.1.0", "name": "Untitled Project", "mapView": {"center": [-4.60089383102632, 39.28702999617074], "zoom": 2, "bearing": 0, "pitch": 0}, "basemapStyleUrl": "https://tiles.openfreemap.org/styles/liberty", "basemapVisible": true, "basemapOpacity": 1, "layers": [], "styles": {}, "preferences": {"map": {"restrictBounds": false, "bounds": [-180, -85, 180, 85], "minZoom": 0, "maxZoom": 24, "maxPitch": 85, "renderWorldCopies": true}, "environmentVariables": []}, "metadata": {}}</script>
<script>
(function () {
  var frame = document.getElementById("geolibre-frame");
  var project = JSON.parse(
    document.getElementById("geolibre-project").textContent
  );
  var loaded = false;
  function load() {
    if (loaded || !frame.contentWindow) return;
    loaded = true;
    frame.contentWindow.postMessage(
      { type: "geolibre:load-project", project: project, seq: 1 },
      "*"
    );
  }
  // The app posts "geolibre:ready" once mounted; reply with the project. Guard
  // on the frame as the source so an unrelated message cannot trigger the load.
  window.addEventListener("message", function (event) {
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (data && data.type === "geolibre:ready") load();
  });
})();
</script>
</body>
</html>
